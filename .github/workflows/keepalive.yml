name: Manter o servico acordado

# Plano gratuito do Render dorme apos ~15 min sem acesso (tela preta de 30-50 s no 1o QR lido).
# Este ping a cada 5 min mantem o servico acordado.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o servico
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://cadastroclientes-fesindico.onrender.com/api/health
