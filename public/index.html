<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ferreira Costa Empresas — Fesíndico Recife</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#CC182C">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FC Fesíndico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fc-red:#CC182C; --fc-red-dark:#AE1922;
    --fc-green:#65B32E; --fc-green-light:#B9CE00;
    --fc-ink:#3a3738; --fc-ink-soft:#645E60;
    --fc-border:#DEDBD3; --fc-border-strong:#AAA499;
    --fc-bg:#F6F5F2; --fc-panel:#EAE9E4; --fc-white:#FFFFFF;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Barlow',system-ui,-apple-system,sans-serif;
    background:var(--fc-bg); color:var(--fc-ink);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{text-wrap:balance;margin:0}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}

  .app{
    max-width:480px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; background:var(--fc-white);
    box-shadow:0 0 40px rgba(0,0,0,.06);
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  }
  .topbar{
    padding:18px 22px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--fc-border);
  }
  .brand{font:800 20px/1 'Barlow Semi Condensed',sans-serif; color:var(--fc-red); letter-spacing:.2px}
  .brand b{color:var(--fc-ink)}
  .brand small{display:block;font:600 10px/1 'Barlow',sans-serif;letter-spacing:1.5px;color:var(--fc-ink-soft);margin-top:3px;text-transform:uppercase}
  .topbar-logo{height:30px;width:auto;flex-shrink:0}
  .progress{display:flex;gap:5px;padding:0 22px;margin-top:14px}
  .progress i{flex:1;height:4px;border-radius:3px;background:var(--fc-border);transition:background .25s}
  .progress i.on{background:var(--fc-red)}

  .stage{flex:1; display:flex; flex-direction:column; padding:28px 22px 20px; gap:22px}
  .step{display:flex; flex-direction:column; gap:22px; animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{font:700 12px 'Barlow',sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--fc-red)}
  .title{font:800 26px/1.15 'Barlow Semi Condensed',sans-serif;color:var(--fc-ink)}
  .sub{font:500 15px/1.5 'Barlow',sans-serif;color:var(--fc-ink-soft)}

  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font:700 12.5px 'Barlow',sans-serif;letter-spacing:.3px;color:var(--fc-ink)}
  .field .req{color:var(--fc-red)}
  .field input{
    height:52px;border:1.8px solid var(--fc-border-strong);border-radius:12px;
    padding:0 15px;font:600 16px 'Barlow',sans-serif;color:var(--fc-ink);background:var(--fc-white);
    outline:none;transition:border-color .15s,box-shadow .15s;width:100%;
  }
  .field input::placeholder{color:#B7B2A9;font-weight:500}
  .field input:focus{border-color:var(--fc-red);box-shadow:0 0 0 4px rgba(204,24,44,.10)}
  .field .hint{font:600 12px 'Barlow',sans-serif;min-height:15px}
  .hint.ok{color:var(--fc-green)}
  .hint.err{color:var(--fc-red)}
  .hint.checking{color:var(--fc-ink-soft)}

  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    display:flex;align-items:center;gap:13px;border:1.8px solid var(--fc-border-strong);
    border-radius:13px;padding:14px 16px;cursor:pointer;background:var(--fc-white);
    transition:border-color .15s,background .15s;
  }
  .choice .mark{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--fc-border-strong);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .choice.chk .mark{border-radius:6px}
  .choice .mark svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
  .choice span.txt{font:600 14.5px 'Barlow',sans-serif;color:var(--fc-ink);flex:1}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice.sel{border-color:var(--fc-red);background:#FDF3F4}
  .choice.sel .mark{border-color:var(--fc-red);background:var(--fc-red)}
  .choice.sel .mark svg{opacity:1}
  .choice .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}

  .bigbtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:2px solid var(--fc-border-strong);border-radius:16px;padding:22px 16px;cursor:pointer;
    background:var(--fc-white);text-align:center;transition:border-color .15s,background .15s,transform .1s;
  }
  .bigbtn:active{transform:scale(.98)}
  .bigbtn .lbl{font:800 16px 'Barlow Semi Condensed',sans-serif;color:var(--fc-ink)}
  .bigbtn .desc{font:500 12.5px 'Barlow',sans-serif;color:var(--fc-ink-soft)}
  .bigbtn.primary{border-color:var(--fc-red);background:linear-gradient(180deg,#fff,#FDF3F4)}
  .bigbtn.primary .lbl{color:var(--fc-red)}

  .foot{padding:16px 22px calc(20px + var(--safe-b));border-top:1px solid var(--fc-border);display:flex;gap:10px}
  .cta{
    flex:1;height:54px;border:none;border-radius:14px;background:var(--fc-red);color:#fff;
    font:800 15.5px 'Barlow Semi Condensed',sans-serif;letter-spacing:.4px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,opacity .15s;
    text-transform:uppercase;
  }
  .cta:hover{background:var(--fc-red-dark)}
  .cta:disabled{opacity:.45;cursor:not-allowed}
  .cta.ghost{background:var(--fc-white);color:var(--fc-ink-soft);border:1.8px solid var(--fc-border-strong);flex:0 0 54px;width:54px;padding:0}
  .cta.ghost svg{width:18px;height:18px}

  .cnpj-status{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:12px;font:600 13.5px 'Barlow',sans-serif}
  .cnpj-status.found{background:#EFF8E9;color:#3f7a1f}
  .cnpj-status.notfound{background:var(--fc-panel);color:var(--fc-ink-soft);flex-direction:column;align-items:stretch;gap:10px}
  .cnpj-status.notfound .msg{display:flex;align-items:center;gap:10px}
  .cnpj-status svg{width:18px;height:18px;flex:0 0 auto}
  .cnpj-status-btn{height:44px;border:none;border-radius:10px;background:var(--fc-red);color:#fff;font:800 13px 'Barlow Semi Condensed',sans-serif;letter-spacing:.3px;cursor:pointer}
  .cnpj-status-btn:hover{background:var(--fc-red-dark)}

  .success{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:28px 26px}
  .success .ring{width:84px;height:84px;border-radius:50%;background:linear-gradient(160deg,var(--fc-green),#4f9723);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(101,179,46,.35)}
  .success .ring svg{width:42px;height:42px;stroke:#fff}
  .success h2{font:800 25px 'Barlow Semi Condensed',sans-serif;color:var(--fc-ink)}
  .success p{font:500 15px/1.55 'Barlow',sans-serif;color:var(--fc-ink-soft);max-width:320px}
  .success .tag{font:700 12px 'Barlow',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--fc-green)}
  .numero-sorteio{
    width:100%;max-width:320px;margin-top:4px;padding:18px 20px;border-radius:16px;
    background:linear-gradient(160deg,var(--fc-red),var(--fc-red-dark));color:#fff;
  }
  .numero-sorteio-label{font:700 11px 'Barlow',sans-serif;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
  .numero-sorteio-valor{font:800 40px 'Barlow Semi Condensed',sans-serif;line-height:1.1;margin:4px 0 8px}
  .numero-sorteio-aviso{font:600 13px/1.5 'Barlow',sans-serif}
  .link-empresas{
    display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:13px 20px;
    border:1.8px solid var(--fc-red);border-radius:12px;color:var(--fc-red);
    font:700 14px 'Barlow',sans-serif;text-decoration:none;transition:background .15s,color .15s;
  }
  .link-empresas:hover{background:var(--fc-red);color:#fff}
  .link-empresas svg{width:20px;height:20px;flex:0 0 auto}

  .checks-grid{display:flex;flex-direction:column;gap:9px}
  .helper{font:600 12.5px 'Barlow',sans-serif;color:var(--fc-ink-soft)}

  @media (max-width:400px){
    .title{font-size:23px}
    .stage{padding:24px 18px 18px}
    .topbar{padding:16px 18px 12px}
    .foot{padding:14px 18px calc(18px + var(--safe-b))}
  }

  /* 23/09/2026, pedido do Victor: usado também num totem de 50" na VERTICAL
     (retrato) — precisa ocupar a tela INTEIRA (não um cartão centralizado
     com fundo ao redor), escalando fonte/campos/botões proporcionalmente,
     e funcionar em qualquer tamanho, não só nesse ("não limite a isso").
     Estratégia: em vez de graus fixos por breakpoint, cada tamanho usa
     clamp() calculado a partir da LARGURA da tela — cresce de forma fluida
     do celular até uma tela gigante, sem "degrau" nem card flutuando.
     .app continua ocupando 100% de qualquer tela (sem max-width, sem
     margem, sem moldura) — só o conteúdo interno escala. */
  @media (min-width:700px){
    .app{max-width:none}
    .topbar{padding:clamp(18px,2.2vw,42px) clamp(22px,3.2vw,60px) clamp(14px,1.6vw,28px)}
    .topbar-logo{height:clamp(30px,2.8vw,56px)}
    .brand{font-size:clamp(20px,1.8vw,34px)}
    .brand small{font-size:clamp(10px,.85vw,16px)}
    .progress{padding:0 clamp(22px,3.2vw,60px);margin-top:clamp(14px,1.4vw,26px)}
    .progress i{height:clamp(4px,.4vw,8px)}
    .stage{padding:clamp(28px,3.6vw,72px) clamp(22px,3.2vw,60px) clamp(20px,2.4vw,44px);gap:clamp(22px,2.4vw,42px);max-width:1100px;margin:0 auto;width:100%}
    .title{font-size:clamp(26px,3vw,54px)}
    .sub{font-size:clamp(15px,1.4vw,26px)}
    .eyebrow{font-size:clamp(12px,1vw,18px)}
    .field label{font-size:clamp(12.5px,1vw,18px)}
    .field input{height:clamp(52px,4.6vw,84px);font-size:clamp(16px,1.5vw,27px);border-radius:clamp(12px,1vw,18px)}
    .field .hint{font-size:clamp(12px,.9vw,17px)}
    .choice{padding:clamp(14px,1.4vw,26px) clamp(16px,1.6vw,28px);border-radius:clamp(13px,1.1vw,20px)}
    .choice .mark{width:clamp(22px,2vw,36px);height:clamp(22px,2vw,36px)}
    .choice span.txt{font-size:clamp(14.5px,1.3vw,23px)}
    .bigbtn{padding:clamp(22px,2.4vw,42px) clamp(16px,1.6vw,28px);border-radius:clamp(16px,1.4vw,26px)}
    .bigbtn .lbl{font-size:clamp(16px,1.5vw,27px)}
    .bigbtn .desc{font-size:clamp(12.5px,1.1vw,19px)}
    .foot{padding:clamp(16px,2vw,36px) clamp(22px,3.2vw,60px) calc(clamp(20px,2.4vw,42px) + var(--safe-b));max-width:1100px;margin:0 auto;width:100%}
    .cta{height:clamp(54px,4.6vw,84px);font-size:clamp(15.5px,1.4vw,24px);border-radius:clamp(14px,1.2vw,22px)}
    .cta.ghost{flex-basis:clamp(54px,4.6vw,84px);width:clamp(54px,4.6vw,84px)}
    .success h2{font-size:clamp(25px,2.6vw,46px)}
    .success p{font-size:clamp(15px,1.4vw,25px);max-width:min(600px,80vw)}
    .success .ring{width:clamp(84px,7vw,130px);height:clamp(84px,7vw,130px)}
    .success .ring svg{width:clamp(42px,3.4vw,64px);height:clamp(42px,3.4vw,64px)}
    .numero-sorteio{max-width:min(560px,80vw);padding:clamp(18px,2vw,36px) clamp(20px,2.2vw,40px)}
    .numero-sorteio-valor{font-size:clamp(40px,4.2vw,76px)}
    .numero-sorteio-aviso{font-size:clamp(13px,1.1vw,19px)}
    .link-empresas{padding:clamp(13px,1.4vw,24px) clamp(20px,2.2vw,38px);font-size:clamp(14px,1.2vw,20px)}
    .link-empresas svg{width:clamp(20px,1.6vw,30px);height:clamp(20px,1.6vw,30px)}
  }

  /* Modal de Termos e LGPD */
  .termos-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    z-index:10000;padding:16px;animation:fadeIn .28s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .termos-modal{
    background:var(--fc-white);border-radius:20px;max-width:600px;width:100%;
    max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .termos-header{
    padding:28px 26px 20px;border-bottom:1px solid var(--fc-border);flex:0 0 auto;
  }
  .termos-header h2{font:800 22px 'Barlow Semi Condensed',sans-serif;color:var(--fc-ink);margin:0}
  .termos-body{
    flex:1;overflow-y:auto;padding:24px 26px;font:500 14px/1.7 'Barlow',sans-serif;color:var(--fc-ink);
  }
  .termos-body h3{
    font:700 15px 'Barlow',sans-serif;color:var(--fc-ink);margin:18px 0 10px;letter-spacing:.3px;text-transform:uppercase;
  }
  .termos-body h3:first-child{margin-top:0}
  .termos-body p{margin:0 0 14px;text-align:justify}
  .termos-body ul{margin:0 0 14px 20px;padding:0}
  .termos-body li{margin-bottom:8px}
  .termos-footer{
    padding:20px 26px 24px;border-top:1px solid var(--fc-border);flex:0 0 auto;
    display:flex;flex-direction:column;gap:14px;
  }
  .termos-check{
    display:flex;align-items:flex-start;gap:12px;padding:12px;
    border:1.5px solid var(--fc-border-strong);border-radius:12px;background:var(--fc-bg);
  }
  .termos-check input[type="checkbox"]{
    width:20px;height:20px;margin-top:2px;flex:0 0 auto;cursor:pointer;accent-color:var(--fc-red);
  }
  .termos-check label{
    font:600 14px 'Barlow',sans-serif;color:var(--fc-ink);cursor:pointer;flex:1;margin:0;padding:0;
  }
  .termos-buttons{display:flex;gap:10px}
  .termos-buttons button{
    flex:1;height:50px;border:none;border-radius:12px;font:800 14px 'Barlow Semi Condensed',sans-serif;
    letter-spacing:.4px;cursor:pointer;transition:background .15s,color .15s;text-transform:uppercase;
  }
  .termos-buttons .btn-continuar{
    background:var(--fc-red);color:#fff;
  }
  .termos-buttons .btn-continuar:hover:not(:disabled){background:var(--fc-red-dark)}
  .termos-buttons .btn-continuar:disabled{opacity:.45;cursor:not-allowed}
  .termos-buttons .btn-rejeitar{
    background:var(--fc-white);color:var(--fc-ink-soft);border:1.5px solid var(--fc-border-strong);
  }
  .termos-buttons .btn-rejeitar:hover{background:var(--fc-panel)}

  @media (max-width:400px){
    .termos-modal{max-height:90vh;border-radius:16px}
    .termos-header{padding:22px 18px 16px}
    .termos-header h2{font-size:18px}
    .termos-body{padding:18px;font-size:13px}
    .termos-footer{padding:16px 18px 18px}
    .termos-buttons button{height:46px;font-size:13px}
  }
</style>
</head>
<body>

<!-- 23/09/2026, diagnóstico temporário pro Victor confirmar a largura real
     que o totem reporta (remover depois de ajustar o breakpoint certo). -->
<div id="debugTela" style="position:fixed;bottom:6px;right:6px;z-index:9999;background:rgba(0,0,0,.7);color:#fff;font:700 11px monospace;padding:4px 8px;border-radius:6px;pointer-events:none"></div>
<script>
  (function(){
    var el = document.getElementById('debugTela');
    function atualizar(){ el.textContent = window.innerWidth + ' x ' + window.innerHeight + ' px'; }
    atualizar();
    window.addEventListener('resize', atualizar);
  })();
</script>

<!-- Modal de Termos e LGPD — aparece antes do formulário -->
<div id="termosOverlay" class="termos-overlay">
  <div class="termos-modal">
    <div class="termos-header" style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0">Regulamento do Sorteio</h2>
      <button type="button" onclick="fecharModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:var(--fc-ink-soft);padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center" aria-label="Fechar">✕</button>
    </div>
    <div class="termos-body" id="termosConteudo">
      <!-- Conteúdo será inserido via JavaScript -->
    </div>
    <div class="termos-footer">
      <div class="termos-check">
        <input type="checkbox" id="chkAceitaTermos">
        <label for="chkAceitaTermos">Li e aceito os termos do regulamento e LGPD</label>
      </div>
      <div class="termos-buttons">
        <button class="btn-rejeitar" onclick="rejeritarTermos()">Rejeitar</button>
        <button class="btn-continuar" id="btnAceitarTermos" onclick="aceitarTermos()" disabled>Continuar</button>
      </div>
    </div>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand"><b>Fesíndico</b><small>Recife · 2026</small></div>
    <img class="topbar-logo" src="/logo-fc.png" alt="Ferreira Costa">
  </div>
  <div class="progress" id="progress"></div>

  <div class="stage" id="stage"></div>

  <div class="foot" id="foot" hidden>
    <button class="cta ghost" id="btnVoltar" onclick="voltar()" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </button>
    <button class="cta" id="btnContinuar" onclick="continuar()">Continuar</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var PRODUTOS = ['Material de Construção','Hidráulica','Elétrica','Ferramentas','Tintas','Pisos e Revestimentos','Louças e Metais','EPI','Materiais de Manutenção','Outros'];
  var SEGMENTOS = ['Construção / Engenharia','Condomínio','Hotel / Pousada','Restaurante / Food Service','Indústria','Comércio','Serviços','Igreja / Instituição','Outro'];
  var OPORTUNIDADES = ['Melhores preços','Condições comerciais','Compras em grande volume','Atendimento personalizado','Quero fazer uma cotação','Quero conhecer as condições para PJ','Outro'];
  var URGENCIAS = [
    {v:'Hoje', cor:'#CC182C'},
    {v:'Nesta semana', cor:'#E08A1E'},
    {v:'Neste mês', cor:'#D8C21A'},
    {v:'Estou apenas pesquisando', cor:'#AAA499'}
  ];

  var state = { fluxo: null, cnpjEncontrado: null, atualizarDados: null };
  var iconCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

      + blocoNumeroSorteio()
      + (mostrarLinkEmpresas
          ? '<a class="link-empresas" href="https://api.whatsapp.com/send/?phone=5508008383083" target="_blank" rel="noopener">'
            + ICONE_WHATSAPP
            + 'Fale com nosso vendedor'
            + '</a>'
          : '')
      + '</div>';
  }

  // ═══════════════════ HELPERS DE MONTAGEM DE TELA ═══════════════════
  function campoTexto(nome, label, placeholder, tipo){
    var req = /\*/.test(label);
    return '<div class="field"><label for="f_'+nome+'">'+esc(label)+'</label>'
      + '<input id="f_'+nome+'" type="'+tipo+'" placeholder="'+esc(placeholder)+'" autocomplete="off" '
      + 'oninput="capturarCampo(\''+nome+'\')" value="'+esc(state[nome]||'')+'"></div>';
  }
  function telaCampos(titulo, eyebrow, camposHtml){
    return '<div class="step"><div class="eyebrow">'+esc(eyebrow)+'</div><h1 class="title">'+esc(titulo)+'</h1>'
      + camposHtml.join('') + '</div>';
  }
  window.capturarCampo = function(nome){ state[nome] = el('f_'+nome).value; atualizarBotaoContinuar(); };

  function telaEscolhaUnica(titulo, eyebrow, campo, opcoes){
    var html = '<div class="step">' + (eyebrow ? '<div class="eyebrow">'+esc(eyebrow)+'</div>' : '') + '<h1 class="title">'+esc(titulo)+'</h1><div class="choices">';
    opcoes.forEach(function(op){
      var sel = state[campo] === op;
      html += '<label class="choice'+(sel?' sel':'')+'" onclick="escolherUnica(\''+campo+'\',\''+esc(op)+'\')">'
        + '<span class="mark">'+iconCheck+'</span><span class="txt">'+esc(op)+'</span></label>';
    });
    html += '</div></div>';
    return html;
  }
  window.escolherUnica = function(campo, valor){
    state[campo] = valor;
    renderTela(ordemAtual[ordemAtual.length-1]);
  };
  function escolhaSimples(campo, valor, label){
    var sel = state[campo] === valor;
    return '<label class="choice'+(sel?' sel':'')+'" onclick="escolherUnica(\''+campo+'\','+valor+')">'
      + '<span class="mark">'+iconCheck+'</span><span class="txt">'+esc(label)+'</span></label>';
  }

  function telaEscolhaMultipla(titulo, eyebrow, campo, opcoes){
    var atuais = state[campo] || [];
    var html = '<div class="step"><div class="eyebrow">'+esc(eyebrow)+'</div><h1 class="title">'+esc(titulo)+'</h1><div class="checks-grid">';
    opcoes.forEach(function(op){
      var sel = atuais.indexOf(op) !== -1;
      html += '<label class="choice chk'+(sel?' sel':'')+'" onclick="toggleMultipla(\''+campo+'\',\''+esc(op)+'\')">'
        + '<span class="mark">'+iconCheck+'</span><span class="txt">'+esc(op)+'</span></label>';
    });
    html += '</div></div>';
    return html;
  }
  window.toggleMultipla = function(campo, valor){
    var lista = state[campo] || [];
    var i = lista.indexOf(valor);
    if (i === -1) lista.push(valor); else lista.splice(i,1);
    state[campo] = lista;
    renderTela(ordemAtual[ordemAtual.length-1]);
  };

  function ligarMascara(nome, fn){
    var input = el('f_'+nome);
    if (!input) return;
    input.addEventListener('input', function(){
      var pos = input.selectionStart, antes = input.value.length;
      input.value = fn(input.value);
      state[nome] = input.value;
      var depois = input.value.length;
      input.selectionEnd = pos + (depois - antes);
      atualizarBotaoContinuar();
    });
  }

  // ═══════════════════ NAVEGAÇÃO ═══════════════════
  function irPara(id, semHistorico){
    if (!semHistorico) ordemAtual.push(id);
    else ordemAtual = [id];
    renderTela(id);
  }
  function renderTela(id){
    var tela = TELAS[id];
    el('stage').innerHTML = tela.render();
    el('foot').hidden = false;
    if (tela.aoRenderizar) tela.aoRenderizar();
    if (tela.foot) tela.foot(); else { botaoContinuar('Continuar', false); ordemAtual.length > 1 ? mostrarVoltar() : esconderVoltar(); }
    atualizarBotaoContinuar();
    atualizarProgresso(id);
    window.scrollTo(0,0);
  }
  function atualizarBotaoContinuar(){
    var tela = TELAS[ordemAtual[ordemAtual.length-1]];
    if (!tela) return;
    el('btnContinuar').disabled = !tela.validar();
  }
  function botaoContinuar(texto, semSeta){
    el('btnContinuar').textContent = texto;
  }
  function mostrarVoltar(){ el('btnVoltar').hidden = false; }
  function esconderVoltar(){ el('btnVoltar').hidden = true; }

  window.continuar = function(){
    var idAtual = ordemAtual[ordemAtual.length-1];
    var tela = TELAS[idAtual];
    if (!tela.validar()) return;
    if (idAtual === 'branch') return; // branch decide sozinho via escolherFluxo
    var prox = tela.proxima();
    irPara(prox);
  };
  window.voltar = function(){
    if (ordemAtual.length <= 1) return;
    ordemAtual.pop();
    renderTela(ordemAtual[ordemAtual.length-1]);
  };

  var ETAPAS_NOVO = ['branch','novoEmpresa','novoContato','novoSegmento','novoInteresse','novoOportunidade','novoUrgencia','novoObra'];
  var ETAPAS_REC  = ['branch','recCnpj','recAtualizarPergunta','recAtualizarDados','recProdutos','recOportunidade','recUrgencia'];
  function atualizarProgresso(id){
    var box = el('progress');
    if (id === 'landing' || id === 'reiniciar' || /^sucesso_|erroEnvio|enviar/.test(id)) { box.innerHTML=''; return; }
    var lista = state.fluxo === 'novo' ? ETAPAS_NOVO : ETAPAS_REC;
    var idx = lista.indexOf(id);
    if (idx === -1) { box.innerHTML=''; return; }
    var html = '';
    lista.forEach(function(_, i){ html += '<i class="'+(i<=idx?'on':'')+'"></i>'; });
    box.innerHTML = html;
  }

  function reiniciarTudo(){
    state = { fluxo: null, cnpjEncontrado: null, atualizarDados: null };
    try { sessionStorage.removeItem('fesindico_aceitaTermos'); } catch(e){}
    el('termosOverlay').hidden = false;
    setTimeout(function(){ irPara('landing', true); }, 10);
  }

  // ═══ Gerenciamento do Modal de Termos e LGPD ═══
  var REGULAMENTO = '<h3>Da Promoção</h3>' +
    '<p>A Ferreira Costa & Cia. Ltda. realiza ação promocional gratuita durante sua participação no evento, ' +
    'consistente no sorteio de 02 (duas) fritadeiras elétricas (air fryer), sendo 01 (uma) unidade por dia de evento. ' +
    'A participação é inteiramente gratuita e independe de qualquer compra.</p>' +
    '' +
    '<h3>Da Participação</h3>' +
    '<p>Podem participar os visitantes maiores de 18 anos que realizarem o cadastro disponibilizado no estande. ' +
    'É permitido 01 (um) cadastro por participante por dia de evento.</p>' +
    '<p><strong>É vedada a participação de:</strong></p>' +
    '<ul>' +
    '<li>Colaboradores da Ferreira Costa (próprios, terceirizados, estagiários e aprendizes) e seus familiares diretos;</li>' +
    '<li>Órgãos, entidades e agentes públicos.</li>' +
    '</ul>' +
    '' +
    '<h3>Do Sorteio</h3>' +
    '<p>O sorteio será realizado de forma aberta, pública e aleatória, no local e horário divulgados no estande, ' +
    'a partir da lista de participantes cadastrados no dia, sendo o resultado devidamente registrado.</p>' +
    '' +
    '<h3>Do Prêmio</h3>' +
    '<p>O prêmio é pessoal, intransferível e não conversível em dinheiro, no todo ou em parte. ' +
    'A assistência técnica e a garantia são de responsabilidade exclusiva do fabricante. ' +
    'Não haverá troca, substituição, reembolso ou reposição do produto.</p>' +
    '' +
    '<h3>Da Entrega</h3>' +
    '<p>A entrega do produto ocorrerá no ato, mediante apresentação de documento oficial de identificação com foto ' +
    'e assinatura do respectivo Comprovante de Entrega. A nota fiscal correspondente não é emitida no local do evento ' +
    'e será enviada posteriormente ao e-mail informado no cadastro, em até 2 (dois) dias úteis.</p>' +
    '' +
    '<h3>Do Uso de Imagem</h3>' +
    '<p>O contemplado poderá autorizar, no ato da entrega, o uso de sua imagem para fins de comprovação ' +
    'e divulgação institucional da ação, sem qualquer ônus.</p>' +
    '' +
    '<h3>Proteção de Dados (LGPD)</h3>' +
    '<p>Os dados coletados serão tratados pela Ferreira Costa & Cia. Ltda., na qualidade de controladora, conforme ' +
    'a Lei nº 13.709/2018 (LGPD), para as seguintes finalidades: (a) realização, controle e comprovação deste sorteio, ' +
    'contato e entrega em caso de premiação, dados esses descartados após o encerramento da ação e cumprimento dos prazos ' +
    'legais aplicáveis; e (b), mediante consentimento específico e opcional do titular para envio de ofertas, campanhas ' +
    'e comunicações comerciais da Ferreira Costa. A participação no sorteio não está condicionada à autorização da finalidade (b). ' +
    'Os dados tratados com base nesse consentimento serão mantidos até que o titular solicite sua exclusão ou revogue a autorização, ' +
    'o que pode ser feito a qualquer momento, sem custo, pelo e-mail privacidade@ferreiracosta.com.br</p>' +
    '' +
    '<h3>Disposições Gerais</h3>' +
    '<p>A participação implica a integral aceitação deste Regulamento. ' +
    'Casos omissos serão resolvidos pela Ferreira Costa. Dúvidas poderão ser encaminhadas à equipe presente no estande.</p>';

  window.aceitarTermos = function(){
    try { sessionStorage.setItem('fesindico_aceitaTermos', '1'); } catch(e){}
    el('termosOverlay').hidden = true;
  };
  window.fecharModal = function(){
    el('termosOverlay').hidden = true;
  };
  window.rejeritarTermos = function(){
    window.location.href = 'about:blank';
  };

  function inicializarModal(){
    el('termosConteudo').innerHTML = REGULAMENTO;
    var chkTermos = el('chkAceitaTermos');
    var btnAceitar = el('btnAceitarTermos');
    chkTermos.addEventListener('change', function(){
      btnAceitar.disabled = !this.checked;
    });
    try {
      if (sessionStorage.getItem('fesindico_aceitaTermos') === '1') {
        el('termosOverlay').hidden = true;
      }
    } catch(e){}
  }

  // boot
  inicializarModal();
  irPara('landing', true);

  // PWA — cache do app shell pra abrir rápido/resistir a wifi instável no
  // estande. Nunca bloqueia o carregamento da página (registra depois do
  // load); se falhar (navegador antigo, sem HTTPS local etc.) o app
  // continua funcionando normal, só sem cache.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* segue sem cache */ });
    });
  }
})();
</script>
